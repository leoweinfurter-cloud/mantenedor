<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Mantenedor — Relatorios</title>
<link rel="stylesheet" href="_style.css" id="theme-link"/>
<style>
/* ── FILTERS ── */
.rel-filters{background:var(--card-bg,#0d1929);border:1px solid var(--border,#1e3a5f);border-radius:14px;padding:16px;margin-bottom:16px}
.rel-filter-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.rel-filter-row.three{grid-template-columns:1fr 1fr 1fr}
.rel-filter-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:#64748b;margin-bottom:5px}
.rel-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

/* ── REPORT TYPE SELECTOR ── */
.rel-type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.rel-type-btn{padding:14px 12px;border-radius:12px;border:2px solid var(--border,#1e3a5f);background:var(--card-bg,#0d1929);cursor:pointer;text-align:center;transition:all .15s;font-family:inherit}
.rel-type-btn.active{border-color:#3b82f6;background:rgba(59,130,246,.08)}
.rel-type-icon{font-size:22px;margin-bottom:6px}
.rel-type-label{font-size:12px;font-weight:700;color:#94a3b8}
.rel-type-btn.active .rel-type-label{color:#60a5fa}

/* ── SUMMARY CARDS ── */
.rel-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
.rel-sum-card{background:var(--card-bg,#0d1929);border:1px solid var(--border,#1e3a5f);border-radius:10px;padding:12px 8px;text-align:center}
.rel-sum-val{font-size:22px;font-weight:800}
.rel-sum-lbl{font-size:10px;color:#64748b;margin-top:2px}

/* ── OS REPORT ── */
.rel-os-card{background:var(--card-bg,#0d1929);border:1px solid var(--border,#1e3a5f);border-radius:12px;padding:0;margin-bottom:14px;overflow:hidden}
.rel-os-topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--inner-bg,#060b12);border-bottom:1px solid var(--border,#1e3a5f)}
.rel-os-numero{font-size:15px;font-weight:800;letter-spacing:.02em}
.rel-os-badges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.rel-os-badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;white-space:nowrap}
.rel-os-body-wrap{padding:14px}
.rel-os-titulo{font-size:14px;font-weight:700;margin-bottom:2px}
.rel-os-meta{font-size:11px;color:#64748b;margin-bottom:10px}
.rel-os-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--border,#1e3a5f)}
.rel-os-section-title{font-size:11px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.rel-os-body{font-size:12px;color:#94a3b8;line-height:1.5}
.rel-os-fields{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.rel-os-field{background:var(--inner-bg,#060b12);border-radius:8px;padding:8px 10px}
.rel-os-field-label{font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
.rel-os-field-val{font-size:13px;font-weight:600}
.rel-os-log-item{font-size:12px;padding:8px 10px;background:var(--inner-bg,#060b12);border-radius:6px;margin-bottom:5px;color:#94a3b8}
.rel-os-log-item b{color:inherit}
.rel-exec-cat-title{font-size:10px;font-weight:800;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin:10px 0 5px}
.rel-exec-cat-title:first-child{margin-top:0}
.rel-parts-table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:4px}
.rel-parts-table th{text-align:left;font-size:10px;color:#64748b;text-transform:uppercase;letter-spacing:.04em;padding:5px 8px;border-bottom:1px solid var(--border,#1e3a5f)}
.rel-parts-table td{padding:6px 8px;border-bottom:1px solid var(--border,#1e3a5f);color:#94a3b8}
.rel-parts-table tr:last-child td{border-bottom:none}
.rel-parts-total td{font-weight:800;color:inherit;border-top:2px solid var(--border,#1e3a5f);border-bottom:none}
.rel-photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:4px}
.rel-photo-item{border-radius:8px;overflow:hidden;border:1px solid var(--border,#1e3a5f);background:var(--inner-bg,#060b12)}
.rel-photo-item img{width:100%;height:100px;object-fit:cover;display:block}
.rel-photo-cap{font-size:10px;color:#64748b;padding:4px 6px}
.rel-os-totais{display:flex;gap:16px;margin-top:12px;padding:10px 14px;background:var(--inner-bg,#060b12);border-radius:10px;flex-wrap:wrap}
.rel-os-totais div{font-size:12px;color:#94a3b8}
.rel-os-totais b{color:inherit;font-size:14px}
.rel-signature-block{margin-top:20px;padding-top:16px;border-top:1px dashed var(--border,#1e3a5f);display:grid;grid-template-columns:1fr 1fr;gap:24px}
.rel-signature-line{border-top:1px solid #64748b;padding-top:6px;text-align:center;font-size:11px;color:#64748b}
.rel-signature-line small{display:block;margin-top:2px;color:#475569}

/* ── HISTORY REPORT ── */
.rel-ativo-block{background:var(--card-bg,#0d1929);border:1px solid var(--border,#1e3a5f);border-radius:14px;margin-bottom:14px;overflow:hidden}
.rel-ativo-header{padding:14px 16px;border-bottom:1px solid var(--border,#1e3a5f);display:flex;align-items:center;justify-content:space-between}
.rel-ativo-nome{font-size:16px;font-weight:800}
.rel-ativo-sub{font-size:12px;color:#64748b;margin-top:2px}
.rel-hist-item{padding:14px 16px;border-bottom:1px solid var(--border,#0d1929)}
.rel-hist-item:last-child{border-bottom:none}
.rel-hist-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.rel-hist-desc{font-size:13px;font-weight:700}
.rel-hist-meta{font-size:11px;color:#64748b;margin-top:2px}
.rel-hist-fields{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.rel-hist-fval{font-size:12px;font-weight:600}
.rel-hist-flbl{font-size:10px;color:#64748b}
.rel-analise{margin-top:10px;padding:10px;background:rgba(129,140,248,.06);border:1px dashed rgba(129,140,248,.3);border-radius:8px}
.rel-analise-title{font-size:11px;font-weight:800;color:#a78bfa;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.rel-analise-tipo{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:rgba(129,140,248,.15);color:#a78bfa;margin-bottom:8px}
.rel-analise-content{font-size:12px;color:#94a3b8;line-height:1.6}
.rel-analise-section{margin-bottom:6px}
.rel-analise-key{font-size:11px;font-weight:700;color:#c4b5fd}

/* ── FORMAL LETTERHEAD HEADER (screen + print) ── */
.rel-letterhead{background:var(--card-bg,#0d1929);border:1px solid var(--border,#1e3a5f);border-radius:14px;padding:18px 20px;margin-bottom:16px}
.rel-lh-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;border-bottom:2px solid var(--border,#1e3a5f);padding-bottom:12px;margin-bottom:12px}
.rel-lh-brand{font-size:17px;font-weight:800;letter-spacing:.02em;color:#3b82f6}
.rel-lh-titulo{font-size:12px;color:#64748b;margin-top:2px}
.rel-lh-emissor{font-size:11px;color:#64748b;margin-top:8px;line-height:1.5}
.rel-lh-meta{text-align:right;font-size:11px;color:#64748b;line-height:1.5}
.rel-lh-cliente{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:12px;color:#94a3b8}
.rel-lh-cliente b{color:inherit;font-weight:700}
.rel-lh-filtros{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border,#1e3a5f);font-size:11px;color:#64748b}

/* ── BUSCA / IMPRESSAO DE OS ESPECIFICA ── */
.rel-os-lookup{display:flex;gap:8px;align-items:flex-end;margin-top:12px;padding-top:12px;border-top:1px dashed var(--border,#1e3a5f)}
.rel-os-lookup input{flex:1}

/* ── EMPTY STATE ── */
.rel-empty{text-align:center;padding:40px 20px;color:#475569;font-size:14px}
.rel-empty-icon{font-size:32px;margin-bottom:10px}

/* ── PRINT ── */
@media print {
  #sidebar,#bottom-nav,#topbar,.rel-filters,.rel-type-grid,.rel-actions,.rel-actions,.ad-banner,#ad-top,.no-print{display:none!important}
  #main{margin:0!important;padding:0!important}
  #ct{padding:14mm 12mm!important}
  body{background:#fff!important;color:#000!important}
  .rel-os-card,.rel-ativo-block,.rel-hist-item{break-inside:avoid}
  .rel-ativo-block,.rel-os-card{border:1px solid #ccc}
  .rel-os-topbar{background:#f2f2f2!important;border-bottom:1px solid #ccc!important}
  .rel-os-field,.rel-hist-fields,.rel-os-log-item,.rel-os-totais{background:#f8f8f8!important}
  .rel-parts-table th,.rel-parts-table td{border-color:#ccc!important}
  .rel-analise{background:#f0ecff!important;border:1px dashed #a78bfa!important}
  .rel-letterhead{border:none!important;border-bottom:2px solid #000!important;border-radius:0!important;padding:0 0 10px!important;margin-bottom:14px!important}
  .rel-lh-top{border-bottom:1px solid #000!important}
  .rel-os-lookup{display:none!important}
  .rel-signature-block{break-inside:avoid;margin-top:36px!important}
  .rel-signature-line{border-top:1px solid #000!important;color:#000!important}
  @page{margin:0}
}


/* ── AD BANNER ── */
.ad-banner{display:none;background:var(--inner-bg,#060b12);border:1px solid var(--border,#1e3a5f);border-radius:10px;padding:10px;margin:0 0 12px;text-align:center;font-size:11px;color:#64748b;}
.ad-banner ins{display:block;}
</style>

<script>
authRequireCoordenador(); // Relatórios é restrito a Coordenador

var relTipo = "os";      // "os" | "historico"
var filtAtivoId = "";
var filtStatus  = "";
var filtTipo    = "";
var filtDtIni   = "";
var filtDtFim   = "";
var filtEmpresa = "";
var filtUnidade = "";
var empresas    = [];
var osLookupMsg = "";    // mensagem de erro da busca por numero de OS

// ── RENDER ────────────────────────────────────────────────────────────
var minhaEmpresa = {nome:"",cnpj:"",telefone:"",endereco:"",contato:""};

function mxLocale(){ var L={pt:"pt-BR",en:"en-US",es:"es-ES"}; return L[LANG.current()]||"pt-BR"; }

function render(){
  empresas = loadEmpresas();
  minhaEmpresa = loadMinhaEmpresa();
  var html = renderFiltros() + renderTipoSelector() + renderLetterhead() + renderRelatorio();
  document.getElementById("ct").innerHTML = html;
}

// ── LETTERHEAD (modelo formal, aparece na tela e na impressao) ────────
function renderLetterhead(){
  var agora = new Date();
  var dataGer = agora.toLocaleDateString(mxLocale())+" "+agora.toLocaleTimeString(mxLocale(),{hour:"2-digit",minute:"2-digit"});
  var tituloRel = relTipo==="os" ? t("rel_titulo_os_rel") : t("rel_titulo_hist_rel");

  var clienteHtml = "";
  if(filtEmpresa){
    var emp = empresas.find(function(e){return e.nome===filtEmpresa;});
    if(emp){
      var unidNome = filtUnidade || t("rel_todas_unidades");
      clienteHtml = '<div class="rel-lh-cliente">'
        +'<div><b>'+t("rel_cliente")+'</b> '+esc(emp.nome)+'</div>'
        +'<div><b>'+t("rel_unidade_lbl")+'</b> '+esc(unidNome)+'</div>'
        +(emp.cnpj?'<div><b>'+t("rel_cnpj")+'</b> '+esc(emp.cnpj)+'</div>':"")
        +(emp.endereco?'<div><b>'+t("rel_endereco")+'</b> '+esc(emp.endereco)+'</div>':"")
        +(emp.contato?'<div><b>'+t("cad_contato_lbl")+'</b> '+esc(emp.contato)+'</div>':"")
        +'</div>';
    }
  }

  var filtrosAtivos = [];
  if(filtAtivoId){var a=ativos.find(function(x){return x.id==filtAtivoId;}); if(a)filtrosAtivos.push(t("rel_ativo")+a.nome);}
  if(filtStatus)  filtrosAtivos.push((relTipo==="os"?t("rel_status_lbl"):t("rel_tipo_lbl"))+filtStatus);
  if(filtTipo)    filtrosAtivos.push((relTipo==="os"?t("rel_tipo_lbl"):"")+filtTipo);
  if(filtDtIni)   filtrosAtivos.push(t("rel_de")+" "+filtDtIni);
  if(filtDtFim)   filtrosAtivos.push(t("rel_ate")+filtDtFim);
  var filtrosHtml = filtrosAtivos.length ? '<div class="rel-lh-filtros no-print">'+t("rel_filtros_apl")+''+filtrosAtivos.map(esc).join(" &bull; ")+'</div>' : "";

  var emissorLinha = [];
  if(minhaEmpresa.cnpj)     emissorLinha.push(t("rel_cnpj")+minhaEmpresa.cnpj);
  if(minhaEmpresa.telefone) emissorLinha.push(minhaEmpresa.telefone);
  if(minhaEmpresa.endereco) emissorLinha.push(minhaEmpresa.endereco);
  var emissorHtml = '<div class="rel-lh-emissor">'
    +esc(minhaEmpresa.nome||"Mantenedor")
    +(emissorLinha.length?' &bull; '+emissorLinha.map(esc).join(" &bull; "):"")
    +(minhaEmpresa.contato?'<br>'+t("cad_contato_resp")+': '+esc(minhaEmpresa.contato):"")
    +'</div>';

  return '<div class="rel-letterhead">'
    +'<div class="rel-lh-top">'
    +'<div><div class="rel-lh-brand">Mantenedor</div><div class="rel-lh-titulo">'+tituloRel+'</div></div>'
    +'<div class="rel-lh-meta">'+t("rel_gerado_em")+'<br>'+dataGer+'</div>'
    +'</div>'
    +emissorHtml
    +clienteHtml
    +filtrosHtml
    +renderOsLookup()
    +'</div>';
}

// ── BUSCA E IMPRESSAO DE UMA OS ESPECIFICA ─────────────────────────────
function renderOsLookup(){
  if(relTipo!=="os") return "";
  return '<div class="rel-os-lookup no-print">'
    +'<div style="flex:1"><div class="rel-filter-label">'+t("rel_imprimir_os")+'</div>'
    +'<input id="rel-os-busca" placeholder="'+t("rel_num_exemplo")+'" onkeydown="if(event.key===\'Enter\')buscarEImprimirOS()"/></div>'
    +'<button class="btn bp bsm" onclick="buscarEImprimirOS()">&#128269; '+t("rel_buscar_impr")+'</button>'
    +(osLookupMsg?'<div style="font-size:11px;color:#f87171;width:100%;margin-top:6px">'+esc(osLookupMsg)+'</div>':"")
    +'</div>';
}

function buscarEImprimirOS(){
  var termo = (document.getElementById("rel-os-busca").value||"").trim().toLowerCase();
  osLookupMsg = "";
  if(!termo){ osLookupMsg=t("rel_informe_num"); render(); return; }
  var achada = ordens.find(function(o){ return (o.numero_os||"").toLowerCase()===termo; })
    || ordens.find(function(o){ return (o.numero_os||"").toLowerCase().indexOf(termo)!==-1; });
  if(!achada){ osLookupMsg=t("rel_nao_encontrada")+"\""+termo+"\"."; render(); return; }
  // Isola a OS encontrada, limpando os demais filtros, e dispara a impressao
  filtAtivoId=""; filtStatus=""; filtTipo=""; filtDtIni=""; filtDtFim=""; filtEmpresa=""; filtUnidade="";
  window.__relOsUnica = achada.id;
  render();
  setTimeout(function(){ window.print(); },150);
}

function renderTipoSelector(){
  return '<div class="rel-type-grid no-print">'
    +typeBtn("os","&#128203;",t("rel_tipo_os"))
    +typeBtn("historico","&#128196;",t("rel_tipo_hist"))
    +'</div>';
}
function typeBtn(tipo,icon,label){
  return '<div class="rel-type-btn'+(relTipo===tipo?" active":"")+'" onclick="setRelTipo(\''+tipo+'\')"><div class="rel-type-icon">'+icon+'</div><div class="rel-type-label">'+label+'</div></div>';
}

function renderFiltros(){
  // Build ativo options (respeitando filtro de empresa/unidade)
  var ativosParaSelect = ativos.filter(function(a){
    if(filtEmpresa && a.empresa!==filtEmpresa) return false;
    if(filtUnidade && a.unidade!==filtUnidade) return false;
    return true;
  });
  var ativoOpts = '<option value="">'+t("rel_todos_ativos")+'</option>'
    + ativosParaSelect.map(function(a){return'<option value="'+a.id+'"'+(filtAtivoId==a.id?' selected':'')+'>'+esc(a.nome)+'</option>';}).join("");

  var statusOpts, tipoOpts;
  if(relTipo === "os"){
    statusOpts = '<option value="">'+t("rel_todos")+'</option><option value="Concluida">'+t("ord_status_conc")+'</option><option value="Aberta">'+t("ord_status_aberta")+'</option><option value="Em Andamento">'+t("ord_status_and")+'</option><option value="Cancelada">'+t("ord_status_canc")+'</option>';
    tipoOpts   = '<option value="">'+t("rel_todos")+'</option><option value="Corretiva">'+t("ord_tipo_corr")+'</option><option value="Preventiva">'+t("ord_tipo_prev")+'</option><option value="Preditiva">'+t("ord_tipo_pred")+'</option><option value="Mista">'+t("rel_mista")+'</option>';
  } else {
    statusOpts = '<option value="">'+t("rel_todos")+'</option><option value="Corretiva">'+t("ord_tipo_corr")+'</option><option value="Preventiva">'+t("ord_tipo_prev")+'</option><option value="Preditiva">'+t("ord_tipo_pred")+'</option>';
    tipoOpts   = '<option value="">'+t("rel_com_e_sem")+'</option><option value="com_analise">'+t("rel_com_analise")+'</option><option value="sem_analise">'+t("rel_sem_analise")+'</option>';
  }

  var empOpts = '<option value="">'+t("rel_todas_empresas")+'</option>'
    + empresas.map(function(e){return'<option value="'+esc(e.nome)+'"'+(filtEmpresa===e.nome?' selected':'')+'>'+esc(e.nome)+'</option>';}).join("");

  var empSelecionada = empresas.find(function(e){return e.nome===filtEmpresa;});
  var unidOpts = '<option value="">'+t("rel_todas_unidades")+'</option>'
    + (empSelecionada&&empSelecionada.unidades ? empSelecionada.unidades.map(function(u){return'<option value="'+esc(u.nome)+'"'+(filtUnidade===u.nome?' selected':'')+'>'+esc(u.nome)+'</option>';}).join("") : "");

  return '<div class="rel-filters no-print">'
    +'<div class="rel-filter-row">'
    +'<div><div class="rel-filter-label">'+t("rel_empresa")+'</div><select onchange="filtEmpresa=this.value;filtUnidade=\'\';render()">'+empOpts+'</select></div>'
    +'<div><div class="rel-filter-label">'+t("rel_unidade")+'</div><select'+(empSelecionada?'':' disabled')+' onchange="filtUnidade=this.value;render()">'+unidOpts+'</select></div>'
    +'</div>'
    +'<div class="rel-filter-row">'
    +'<div><div class="rel-filter-label">'+t("ord_f_ativo_label")+'</div><select onchange="filtAtivoId=this.value;render()">'+ativoOpts+'</select></div>'
    +'<div><div class="rel-filter-label">'+(relTipo==="os"?t("rel_status"):t("ord_f_tipo"))+'</div><select onchange="'+(relTipo==="os"?"filtStatus":"filtTipo")+'=this.value;render()">'+statusOpts+'</select></div>'
    +'</div>'
    +'<div class="rel-filter-row three">'
    +'<div><div class="rel-filter-label">'+(relTipo==="os"?t("ord_f_tipo"):t("rel_analise"))+'</div><select onchange="'+(relTipo==="os"?"filtTipo":"filtStatus")+'=this.value;render()">'+tipoOpts+'</select></div>'
    +'<div><div class="rel-filter-label">'+t("rel_data_inicio")+'</div><input type="date" value="'+filtDtIni+'" onchange="filtDtIni=this.value;render()"/></div>'
    +'<div><div class="rel-filter-label">'+t("rel_data_fim")+'</div><input type="date" value="'+filtDtFim+'" onchange="filtDtFim=this.value;render()"/></div>'
    +'</div>'
    +'<div class="rel-actions">'
    +'<button class="btn bx bsm" onclick="limparFiltros()">'+t("rel_limpar")+'</button>'
    +'<button class="btn bp bsm" onclick="window.print()">&#128424; '+t("rel_imprimir_pdf")+'</button>'
    +'</div></div>';
}

// ── OS REPORT ─────────────────────────────────────────────────────────
function renderRelatorio(){
  return relTipo === "os" ? renderRelOS() : renderRelHist();
}

function renderRelOS(){
  // Impressao de uma OS especifica (busca por numero): ignora demais filtros
  if(window.__relOsUnica){
    var unica = ordens.filter(function(o){return o.id===window.__relOsUnica;});
    window.__relOsUnica = null;
    if(unica.length) return renderRelOSCards(unica,true);
  }

  var ativosById = {};
  ativos.forEach(function(a){ativosById[a.id]=a;});

  var filtered = ordens.filter(function(o){
    if(filtAtivoId && o.ativo_id!=filtAtivoId) return false;
    if(filtStatus  && o.status!==filtStatus)   return false;
    if(filtTipo    && o.tipo!==filtTipo)        return false;
    if(filtDtIni   && o.abertura < filtDtIni)  return false;
    if(filtDtFim   && o.abertura > filtDtFim)  return false;
    if(filtEmpresa || filtUnidade){
      var atv = ativosById[o.ativo_id];
      if(filtEmpresa && (!atv || atv.empresa!==filtEmpresa)) return false;
      if(filtUnidade && (!atv || atv.unidade!==filtUnidade)) return false;
    }
    return true;
  });
  return renderRelOSCards(filtered,false);
}

function renderRelOSCards(filtered,unica){

  var summary = "";
  if(!unica){
    // Summary
    var conc  = filtered.filter(function(o){return o.status==="Concluida";}).length;
    var aber  = filtered.filter(function(o){return o.status==="Aberta";}).length;
    var andamento = filtered.filter(function(o){return o.status==="Em Andamento";}).length;
    var criticas  = filtered.filter(function(o){return o.prioridade==="Critica";}).length;

    summary = '<div class="rel-summary">'
      +sumCard(filtered.length,t("rel_total"),"#60a5fa")
      +sumCard(conc,t("rel_concluidas"),"#4ade80")
      +sumCard(aber+andamento,t("rel_em_aberto"),"#fbbf24")
      +sumCard(criticas,t("rel_criticas"),"#f87171")
      +'</div>';
  }

  if(!filtered.length) return summary+'<div class="rel-empty"><div class="rel-empty-icon">&#128203;</div>'+t("rel_vazio_os")+'</div>';

  var ativosById = {};
  ativos.forEach(function(a){ativosById[a.id]=a;});

  var cards = filtered.map(function(o){
    var col = TC[o.tipo]||"#60a5fa";
    var statCol = SC[o.status]||"#9ca3af";
    var atv = ativosById[o.ativo_id];
    var localInfo = atv ? [atv.empresa,atv.unidade,atv.localizacao].filter(Boolean).map(esc).join(" &bull; ") : "";

    var log = (o.execLog||[]);
    var obsEntries  = log.filter(function(e){return e.tipo==="observacao";});
    var medEntries  = log.filter(function(e){return e.tipo==="medicao";});
    var pecaEntries = log.filter(function(e){return e.tipo==="peca";});
    var fotoEntries = log.filter(function(e){return e.tipo==="foto";});

    var totalHoras=0, totalPecas=0;
    log.forEach(function(e){
      totalHoras += e.horas||0;
      if(e.tipo==="peca") totalPecas += (e.qty||1)*(e.custo||0);
    });

    var execHtml = "";
    if(log.length){
      execHtml += '<div class="rel-os-section"><div class="rel-os-section-title">'+t("ord_reg_exec")+' ('+log.length+')</div>';

      if(obsEntries.length){
        execHtml += '<div class="rel-exec-cat-title">'+t("rel_obs_tec")+'</div>'
          +obsEntries.map(function(e){
            return '<div class="rel-os-log-item">'+esc(e.data||"")+(e.tecnico?' &bull; <b>'+esc(e.tecnico)+'</b>':"")+(e.horas?' &bull; '+e.horas+'h':"")+'<br>'+esc(e.desc||"")+'</div>';
          }).join("");
      }
      if(medEntries.length){
        execHtml += '<div class="rel-exec-cat-title">'+t("rel_med_reg")+'</div>'
          +'<table class="rel-parts-table"><tr><th>'+t("rel_col_data")+'</th><th>'+t("rel_col_param")+'</th><th>'+t("rel_col_valor")+'</th><th>'+t("rel_col_limite")+'</th><th>'+t("rel_col_cond")+'</th></tr>'
          +medEntries.map(function(e){
            var fora = e.cond && /fora/i.test(e.cond);
            return '<tr><td>'+esc(e.data||"")+'</td><td>'+esc(e.param||"")+'</td><td>'+esc(e.valor)+'</td><td>'+esc(e.limite)+'</td>'
              +'<td style="'+(fora?"color:#f87171;font-weight:700":"")+'">'+esc(e.cond||"--")+'</td></tr>';
          }).join("")
          +'</table>';
      }
      if(pecaEntries.length){
        execHtml += '<div class="rel-exec-cat-title">'+t("rel_pecas_mat")+'</div>'
          +'<table class="rel-parts-table"><tr><th>'+t("rel_col_desc")+'</th><th>'+t("rel_col_qtd")+'</th><th>'+t("rel_col_custo_un")+'</th><th>'+t("rel_col_subtotal")+'</th></tr>'
          +pecaEntries.map(function(e){
            var qty=e.qty||1, sub=qty*(e.custo||0);
            return '<tr><td>'+esc(e.desc||"")+(e.obs?'<br><span style="font-size:10px">'+esc(e.obs)+'</span>':"")+'</td><td>'+qty+'</td><td>R$ '+(e.custo||0).toLocaleString("pt-BR")+'</td><td>R$ '+sub.toLocaleString("pt-BR")+'</td></tr>';
          }).join("")
          +'<tr class="rel-parts-total"><td colspan="3">'+t("rel_total_pecas")+'</td><td>R$ '+totalPecas.toLocaleString("pt-BR")+'</td></tr>'
          +'</table>';
      }
      if(fotoEntries.length){
        execHtml += '<div class="rel-exec-cat-title">'+t("rel_reg_foto")+'</div>'
          +'<div class="rel-photo-grid">'
          +fotoEntries.map(function(e){
            return '<div class="rel-photo-item">'+(e.foto?'<img src="'+e.foto+'" alt="Foto da execucao"/>':'')+(e.desc?'<div class="rel-photo-cap">'+esc(e.desc)+'</div>':'')+'</div>';
          }).join("")
          +'</div>';
      }
      execHtml += '</div>';
    }

    // Checklist de planos
    var checkHtml = "";
    if(o.planos_exec && o.planos_exec.length){
      checkHtml = '<div class="rel-os-section"><div class="rel-os-section-title">'+t("rel_checklist")+'</div>'
        +o.planos_exec.map(function(pe){
          var concCount=pe.acoes.filter(function(a){return a.concluida;}).length;
          return'<div class="rel-os-log-item" style="margin-bottom:6px"><b>'+esc(pe.plano_nome)+'</b> — '+concCount+'/'+pe.acoes.length+' acoes<br>'
            +pe.acoes.map(function(a){return'<span style="color:'+(a.concluida?"#4ade80":"#f87171")+'">'+( a.concluida?"✓":"✗")+'</span> '+esc(a.desc)+(a.valor_exec?' = '+a.valor_exec+(a.unidade?' '+a.unidade:''):'');}).join(' &bull; ')
            +'</div>';
        }).join("")+'</div>';
    }

    var totaisHtml = (totalHoras>0||totalPecas>0)
      ? '<div class="rel-os-totais">'
        +(totalHoras>0?'<div>'+t("rel_total_horas")+'<b>'+totalHoras.toFixed(1)+'h</b></div>':"")
        +(totalPecas>0?'<div>'+t("rel_total_pecas")+'<b>R$ '+totalPecas.toLocaleString("pt-BR")+'</b></div>':"")
        +'</div>' : "";

    var assinaturaHtml = unica
      ? '<div class="rel-signature-block">'
        +'<div class="rel-signature-line">'+esc(o.tecnico||"")+'<small>'+t("rel_tec_exec")+'</small></div>'
        +'<div class="rel-signature-line">&nbsp;<small>'+t("rel_aceite")+'</small></div>'
        +'</div>' : "";

    return '<div class="rel-os-card">'
      +'<div class="rel-os-topbar">'
      +'<div class="rel-os-numero">OS '+esc(o.numero_os||("#"+o.id))+'</div>'
      +'<div class="rel-os-badges">'
      +'<span class="rel-os-badge" style="background:'+col+'20;color:'+col+'">'+esc(o.tipo)+'</span>'
      +'<span class="rel-os-badge" style="background:'+statCol+'20;color:'+statCol+'">'+esc(o.status)+'</span>'
      +(o.prioridade==="Critica"?'<span class="rel-os-badge" style="background:#f8717120;color:#f87171">CRITICA</span>':"")
      +'</div></div>'
      +'<div class="rel-os-body-wrap">'
      +'<div class="rel-os-titulo">'+esc(o.titulo)+'</div>'
      +'<div class="rel-os-meta">'+esc(o.ativo||"")+(localInfo?' &bull; '+localInfo:'')+'</div>'
      +(o.descricao?'<div class="rel-os-section"><div class="rel-os-section-title">'+t("rel_desc_servico")+'</div><div class="rel-os-body">'+esc(o.descricao)+'</div></div>':"")
      +'<div class="rel-os-section"><div class="rel-os-section-title">'+t("rel_dados_gerais")+'</div><div class="rel-os-fields">'
      +osField(t("rel_abertura"),o.abertura||"--")
      +osField(t("rel_prazo"),o.prazo||"--")
      +osField(t("rel_tecnico"),o.tecnico||"--")
      +osField(t("rel_prioridade"),o.prioridade||"--")
      +'</div></div>'
      +execHtml+checkHtml+totaisHtml+assinaturaHtml
      +'</div></div>';
  }).join("");

  return summary+cards;
}

function osField(label,val){
  return'<div class="rel-os-field"><div class="rel-os-field-label">'+label+'</div><div class="rel-os-field-val">'+esc(val)+'</div></div>';
}

// ── HISTORY REPORT ────────────────────────────────────────────────────
function renderRelHist(){
  var ativosRel = ativos.filter(function(a){
    if(filtAtivoId && a.id!=filtAtivoId) return false;
    if(filtEmpresa && a.empresa!==filtEmpresa) return false;
    if(filtUnidade && a.unidade!==filtUnidade) return false;
    return true;
  });

  var totalHist=0, totalAnal=0, totalCusto=0, totalHoras=0;
  var blocks = ativosRel.map(function(a){
    var f = fichas[a.id];
    if(!f || !f.historico || !f.historico.length) return "";
    var hist = f.historico.filter(function(h){
      if(filtStatus && h.tipo!==filtStatus)   return false;
      if(filtDtIni  && h.data < filtDtIni)    return false;
      if(filtDtFim  && h.data > filtDtFim)    return false;
      if(filtTipo==="com_analise"  && !h.analise) return false;
      if(filtTipo==="sem_analise"  && h.analise)  return false;
      return true;
    });
    if(!hist.length) return "";

    totalHist += hist.length;
    hist.forEach(function(h){ totalAnal += h.analise?1:0; totalCusto += h.custo||0; totalHoras += h.horas||0; });

    var items = hist.map(function(h){
      var col = TC[h.tipo]||"#60a5fa";
      var analHtml = "";
      if(h.analise){
        var an = h.analise;
        var tipo = an.tipo||"5porques";
        analHtml = '<div class="rel-analise">'
          +'<div class="rel-analise-title">&#9888; Analise de Falha</div>'
          +'<div class="rel-analise-tipo">'+( ANAL_LABELS[tipo]||tipo)+'</div>'
          +renderAnaliseContent(an)
          +'</div>';
      }
      return '<div class="rel-hist-item">'
        +'<div class="rel-hist-header">'
        +'<div style="flex:1">'
        +'<div style="display:flex;gap:6px;margin-bottom:4px"><span style="font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;background:'+col+'20;color:'+col+'">'+esc(h.tipo)+'</span></div>'
        +'<div class="rel-hist-desc">'+esc(h.desc)+'</div>'
        +'<div class="rel-hist-meta">'+esc(h.data||"--")+(h.tecnico?' &bull; '+esc(h.tecnico):'')+'</div>'
        +'</div></div>'
        +(h.obs?'<div style="font-size:12px;color:#64748b;margin:6px 0">'+esc(h.obs)+'</div>':"")
        +'<div class="rel-hist-fields">'
        +'<div><div class="rel-hist-flbl">'+t("rel_col_horas")+'</div><div class="rel-hist-fval">'+(h.horas||0)+'h</div></div>'
        +'<div><div class="rel-hist-flbl">'+t("rel_col_custo")+'</div><div class="rel-hist-fval">R$ '+(h.custo||0)+'</div></div>'
        +'<div><div class="rel-hist-flbl">'+t("rel_analise")+'</div><div class="rel-hist-fval" style="color:'+(h.analise?"#a78bfa":"#475569")+'">'+(h.analise?t("rel_sim"):t("rel_nao"))+'</div></div>'
        +'</div>'
        +analHtml+'</div>';
    }).join("");

    return '<div class="rel-ativo-block">'
      +'<div class="rel-ativo-header">'
      +'<div><div class="rel-ativo-nome">'+esc(a.nome)+'</div><div class="rel-ativo-sub">'+esc(a.categoria||"")+(a.localizacao?' &bull; '+esc(a.localizacao):'')+'</div></div>'
      +'<div style="text-align:right"><div style="font-size:12px;color:#64748b">'+hist.length+' registro(s)</div></div>'
      +'</div>'
      +items+'</div>';
  }).join("");

  // Summary
  var summary = '<div class="rel-summary">'
    +sumCard(totalHist,"Registros","#60a5fa")
    +sumCard(totalAnal,"Com analise","#a78bfa")
    +sumCard(totalHoras.toFixed(0)+"h","Horas total","#f59e0b")
    +sumCard("R$"+totalCusto.toLocaleString("pt-BR"),"Custo total","#4ade80")
    +'</div>';

  if(!blocks.replace(/\s/g,"")){
    return summary+'<div class="rel-empty"><div class="rel-empty-icon">&#128196;</div>'+t("rel_vazio_hist")+'</div>';
  }
  return summary+blocks;
}

function renderAnaliseContent(an){
  var html = "";
  var tipo = an.tipo||"5porques";
  if(tipo==="5porques"&&an.porques){
    html += '<div class="rel-analise-content">'
      +an.porques.filter(Boolean).map(function(p,i){return'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_porque")+(i+1)+':</span> '+esc(p)+'</div>';}).join("")
      +(an.causa_raiz?'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_causa_raiz")+'</span> '+esc(an.causa_raiz)+'</div>':"")
      +(an.acao?'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_acao_corr")+'</span> '+esc(an.acao)+'</div>':"")
      +'</div>';
  } else if(tipo==="ishikawa"&&an.causas){
    var cats=Object.keys(an.causas).filter(function(k){return an.causas[k];});
    html += '<div class="rel-analise-content">'
      +cats.map(function(k){return'<div class="rel-analise-section"><span class="rel-analise-key">'+k+':</span> '+esc(an.causas[k])+'</div>';}).join("")
      +(an.causa_raiz?'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_causa_raiz")+'</span> '+esc(an.causa_raiz)+'</div>':"")
      +'</div>';
  } else if(tipo==="fmea"&&an.modo){
    html += '<div class="rel-analise-content">'
      +(an.modo?'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_modo_falha")+'</span> '+esc(an.modo)+'</div>':"")
      +(an.efeito?'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_efeito")+'</span> '+esc(an.efeito)+'</div>':"")
      +(an.causa?'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_causa")+'</span> '+esc(an.causa)+'</div>':"")
      +(an.nprs!==undefined?'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_npr")+'</span> S:'+an.nprs+' O:'+an.npro+' D:'+an.nprd+' = <b>'+(an.nprs*an.npro*an.nprd)+'</b></div>':"")
      +(an.acao?'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_acao")+'</span> '+esc(an.acao)+'</div>':"")
      +'</div>';
  } else if(an.descricao||an.acao||an.causa_raiz){
    html += '<div class="rel-analise-content">'
      +(an.descricao?'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_descricao")+'</span> '+esc(an.descricao)+'</div>':"")
      +(an.causa_raiz?'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_causa_raiz")+'</span> '+esc(an.causa_raiz)+'</div>':"")
      +(an.acao?'<div class="rel-analise-section"><span class="rel-analise-key">'+t("an_acao_corr")+'</span> '+esc(an.acao)+'</div>':"")
      +'</div>';
  }
  return html;
}

// ── HELPERS ───────────────────────────────────────────────────────────
function sumCard(val,label,color){
  return'<div class="rel-sum-card"><div class="rel-sum-val" style="color:'+color+'">'+val+'</div><div class="rel-sum-lbl">'+label+'</div></div>';
}
function setRelTipo(t){ relTipo=t; filtStatus=""; filtTipo=""; osLookupMsg=""; render(); }
function limparFiltros(){ filtAtivoId=""; filtStatus=""; filtTipo=""; filtDtIni=""; filtDtFim=""; filtEmpresa=""; filtUnidade=""; osLookupMsg=""; render(); }

initApp(render);
fetchMinhaEmpresa().then(function(d){ minhaEmpresa=d; render(); }).catch(function(){/* fica com o cache local */});
</script>

window.addEventListener("langchange",function(){ LANG.applyStatic(); render(); });
</script>
