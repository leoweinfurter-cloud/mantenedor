<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#3a3d42">
<title>Entrar — Avaliação de Máquinas</title>
<link rel="stylesheet" href="assets/avaliacao.css">
</head>
<body>
  <div class="avl-shell" style="max-width:400px; padding-top:56px;">
    <div style="text-align:center; margin-bottom:24px;">
      <span class="avl-logo" style="width:54px;height:54px;font-size:1.5rem;margin-bottom:10px;">M</span>
      <h1>Avaliação de Máquinas</h1>
      <p>Levantamento em campo e cálculo do valor dos bens</p>
    </div>
    <form id="form-login" class="avl-card">
      <div class="avl-grid">
        <label class="avl-field"><span>E-mail</span><input type="email" id="email" required autocomplete="username"></label>
        <label class="avl-field"><span>Senha</span><input type="password" id="senha" required autocomplete="current-password"></label>
      </div>
      <p id="erro" style="color:var(--avl-bad); font-size:.85rem; display:none; margin-top:10px;"></p>
      <button type="submit" class="avl-btn" id="btn" style="width:100%; margin-top:12px;">Entrar</button>
      <p style="margin-top:12px; font-size:.8rem;">Use o mesmo e-mail e senha do Mantenedor. Depois de entrar uma vez, o levantamento em campo funciona sem internet.</p>
    </form>
  </div>
  <script src="calc.js"></script>
  <script src="sync.js"></script>
  <script src="_shared.js"></script>
  <script>
    if (avlSession() && avlSession().access_token) window.location.replace("index.html");
    document.getElementById("form-login").addEventListener("submit", async function (e) {
      e.preventDefault();
      var btn = document.getElementById("btn"), erro = document.getElementById("erro");
      erro.style.display = "none"; btn.disabled = true; btn.textContent = "Entrando…";
      try {
        await avlLogin(document.getElementById("email").value.trim(), document.getElementById("senha").value);
        window.location.href = "index.html";
      } catch (err) {
        erro.textContent = err.message === "Invalid login credentials" ? "E-mail ou senha incorretos."
          : (navigator.onLine ? err.message : "Sem conexão: o primeiro login precisa de internet.");
        erro.style.display = "block"; btn.disabled = false; btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
