<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checklist — Caspere</title>
<link rel="stylesheet" href="assets/caspere.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/signature_pad/4.1.7/signature_pad.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div class="cp-topbar">
    <div class="cp-brand"><a href="painel.html" style="text-decoration:none; color:inherit;">← Caspere</a></div>
  </div>

  <div class="cp-shell">
    <div id="cabecalho-equip"><p>Carregando equipamento…</p></div>

    <form id="form-checklist" style="display:none;">
      <div class="cp-card">
        <h2>Dados do atendimento</h2>
        <div class="cp-field">
          <label>Tipo de manutenção</label>
          <div style="display:flex; gap:16px; margin-top:4px;">
            <label style="display:flex; align-items:center; gap:6px; font-weight:normal;">
              <input type="radio" name="tipo_manutencao" value="preventiva" checked style="width:auto;"> Preventiva
            </label>
            <label style="display:flex; align-items:center; gap:6px; font-weight:normal;">
              <input type="radio" name="tipo_manutencao" value="corretiva" style="width:auto;"> Corretiva
            </label>
          </div>
        </div>
        <div class="cp-field">
          <label for="solicitado-por">Solicitado por</label>
          <input type="text" id="solicitado-por" name="solicitado_por" placeholder="Nome de quem solicitou o atendimento">
        </div>
        <div style="display:flex; gap:12px;">
          <div class="cp-field" style="flex:1;">
            <label for="horario-inicio">Horário início</label>
            <input type="time" id="horario-inicio" name="horario_inicio">
          </div>
          <div class="cp-field" style="flex:1;">
            <label for="horario-termino">Horário término</label>
            <input type="time" id="horario-termino" name="horario_termino">
          </div>
        </div>
        <div class="cp-field">
          <label for="numero-ciclos">Execução de ciclo completo com cronometragem dos tempos (nº de ciclos, se aplicável)</label>
          <input type="text" id="numero-ciclos" name="numero_ciclos" placeholder="Ex: 02">
        </div>
      </div>

      <div class="cp-card">
        <h2>Checklist de execução</h2>
        <div id="itens-checklist"></div>
      </div>

      <div class="cp-card">
        <h2>Peças substituídas</h2>
        <div id="pecas-tabela"></div>
        <button type="button" class="cp-btn-outline cp-btn" style="margin-top:8px;" onclick="adicionarLinhaPeca()">+ Adicionar peça</button>
      </div>

      <div class="cp-card">
        <h3>Lacre(s) nº(s)</h3>
        <div class="cp-field">
          <input type="text" name="lacres" placeholder="Números dos lacres aplicados, se houver">
        </div>
        <h3>Observações gerais</h3>
        <div class="cp-field">
          <textarea name="observacoes_gerais" placeholder="Outras informações importantes sobre o atendimento"></textarea>
        </div>
      </div>

      <div class="cp-card">
        <h2>Assinaturas</h2>
        <div class="cp-field">
          <label>Técnico responsável</label>
          <input type="text" id="nome-tecnico" readonly>
        </div>
        <div class="cp-sig-wrap" style="position:relative;">
          <canvas id="sig-tecnico" class="cp-signature-pad"></canvas>
          <div class="cp-sig-overlay" id="overlay-tecnico" onclick="ativarAssinatura('tecnico')">
            <span>Toque para assinar</span>
          </div>
        </div>
        <button type="button" class="cp-btn-ghost cp-btn" style="margin-top:6px;" onclick="limparAssinatura('tecnico')">Limpar assinatura</button>

        <div class="cp-field" style="margin-top:20px;">
          <label for="nome-cliente">Nome de quem está assinando pelo cliente</label>
          <input type="text" id="nome-cliente" required>
        </div>
        <div class="cp-sig-wrap" style="position:relative;">
          <canvas id="sig-cliente" class="cp-signature-pad"></canvas>
          <div class="cp-sig-overlay" id="overlay-cliente" onclick="ativarAssinatura('cliente')">
            <span>Toque para assinar</span>
          </div>
        </div>
        <button type="button" class="cp-btn-ghost cp-btn" style="margin-top:6px;" onclick="limparAssinatura('cliente')">Limpar assinatura</button>
      </div>

      <p id="erro-checklist" style="color:var(--cp-nao-conforme); display:none;"></p>
      <button type="submit" class="cp-btn" id="btn-finalizar">Finalizar e enviar relatório</button>
    </form>
  </div>

  <script src="_shared.js"></script>
  <script>
    let equipamento = null;
    let itensModelo = [];
    let sigPadTecnico, sigPadCliente;
    let pecaIdCounter = 0;

    function renderItem(item) {
      return `
        <div class="cp-field" style="border-bottom:1px solid var(--cp-border); padding-bottom:14px; margin-bottom:14px;">
          <label style="font-size:0.95rem; color:var(--cp-ink); margin-bottom:8px;">${esc(item.descricao)}</label>
          <div class="cp-status-group">
            <label class="cp-status-opt conforme">
              <input type="radio" name="item-${item.id}" value="conforme" required>
              <span class="cp-status-tag"><span class="cp-bar"></span><span class="cp-label">Conforme</span></span>
            </label>
            <label class="cp-status-opt nao_conforme">
              <input type="radio" name="item-${item.id}" value="nao_conforme" onclick="mostrarObsItem('${item.id}')">
              <span class="cp-status-tag"><span class="cp-bar"></span><span class="cp-label">Não conforme</span></span>
            </label>
            <label class="cp-status-opt nao_se_aplica">
              <input type="radio" name="item-${item.id}" value="nao_se_aplica">
              <span class="cp-status-tag"><span class="cp-bar"></span><span class="cp-label">N/A</span></span>
            </label>
          </div>
          <div id="obs-${item.id}" style="display:none; margin-top:8px;">
            <textarea name="obs-item-${item.id}" placeholder="O que foi encontrado? (obrigatório para itens não conformes)" style="min-height:56px;"></textarea>
          </div>
        </div>`;
    }

    function mostrarObsItem(itemId) {
      document.getElementById(`obs-${itemId}`).style.display = "block";
    }

    // -------- Peças substituídas (tabela dinâmica) --------
    function linhaPecaHtml(id) {
      return `
        <div class="peca-linha" data-id="${id}" style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
          <input type="text" placeholder="Qtde" style="width:60px;" data-campo="qtde">
          <input type="text" placeholder="Peça/componente" style="flex:1;" data-campo="peca">
          <label style="display:flex; align-items:center; gap:4px; font-weight:normal; font-size:0.8rem; white-space:nowrap;">
            <input type="checkbox" style="width:auto;" data-campo="substituida" checked> Substituída
          </label>
          <button type="button" class="cp-btn-ghost cp-btn" style="width:auto; padding:6px 10px;" onclick="removerLinhaPeca(${id})">✕</button>
        </div>`;
    }

    function adicionarLinhaPeca() {
      pecaIdCounter++;
      document.getElementById("pecas-tabela").insertAdjacentHTML("beforeend", linhaPecaHtml(pecaIdCounter));
    }

    function removerLinhaPeca(id) {
      document.querySelector(`.peca-linha[data-id="${id}"]`)?.remove();
    }

    function coletarPecas() {
      return Array.from(document.querySelectorAll(".peca-linha")).map(linha => ({
        qtde: linha.querySelector('[data-campo="qtde"]').value,
        peca: linha.querySelector('[data-campo="peca"]').value,
        substituida: linha.querySelector('[data-campo="substituida"]').checked,
      })).filter(p => p.peca.trim() !== "");
    }

    function limparAssinatura(tipo) {
      (tipo === "tecnico" ? sigPadTecnico : sigPadCliente).clear();
      // Limpar também trava de novo — evita ficar aberto pra
      // marcar sem querer enquanto rola a tela até o próximo campo.
      document.getElementById(`overlay-${tipo}`).style.display = "flex";
    }

    function ativarAssinatura(tipo) {
      document.getElementById(`overlay-${tipo}`).style.display = "none";
    }

    function ajustarCanvas(canvas) {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
    }

    // -------- Geração do PDF, no formato do relatório em papel --------
    function checkbox(doc, x, y, marcado) {
      doc.rect(x, y - 8, 9, 9);
      if (marcado) {
        doc.setFont("helvetica", "bold");
        doc.text("X", x + 1.5, y - 1);
        doc.setFont("helvetica", "normal");
      }
    }

    async function gerarPdf(relatorio, respostas, funcionario, dadosForm) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: "pt", format: "a4" });
      const margin = 40;
      const pageWidth = 515;
      let y = margin;

      // Cabeçalho — nome da empresa
      doc.setFont("helvetica", "bold");
      doc.setFontSize(15);
      doc.text("CASPERE ASSISTÊNCIA TÉCNICA EM", margin, y); y += 16;
      doc.text("EQUIPAMENTOS HOSPITALARES LTDA", margin, y); y += 20;
      doc.setDrawColor(20, 30, 35);
      doc.line(margin, y, margin + pageWidth, y); y += 18;

      doc.setFontSize(12);
      const tituloTipo = { autoclave: "AUTOCLAVE", osmose_reversa: "OSMOSE REVERSA", termodesinfectora: "TERMODESINFECTORA" }[equipamento.tipo] || "";
      doc.text(`RELATÓRIO TÉCNICO / ${tituloTipo}`, margin, y);
      doc.text(`DATA: ${new Date().toLocaleDateString("pt-BR")}`, margin + 340, y);
      y += 18;
      doc.line(margin, y, margin + pageWidth, y); y += 16;

      // Dados do cliente
      const cliente = equipamento.caspere_clientes || {};
      doc.setFontSize(9);
      const campo = (label, valor) => {
        doc.setFont("helvetica", "bold"); doc.text(label, margin, y);
        doc.setFont("helvetica", "normal"); doc.text(valor || "—", margin + 100, y);
        y += 13;
      };
      campo("CLIENTE:", cliente.razao_social);
      campo("SOLICITADO POR:", dadosForm.solicitado_por);
      campo("FONE/FAX:", cliente.telefone);
      campo("ENDEREÇO:", cliente.endereco);
      campo("BAIRRO:", cliente.bairro);
      campo("CIDADE:", `${cliente.cidade || ""}${cliente.uf ? " / " + cliente.uf : ""}`);
      campo("CEP:", cliente.cep);
      campo("CNPJ:", cliente.cnpj);
      campo("INSCR. EST.:", cliente.inscricao_estadual);
      campo("EQUIPAMENTO:", equipamento.identificacao);
      campo("MOD.:", equipamento.modelo);
      campo("FABRI.:", equipamento.fabricante);
      campo("HORÁRIO INÍCIO:", dadosForm.horario_inicio);
      campo("HORÁRIO TÉRMINO:", dadosForm.horario_termino);
      y += 4;
      doc.line(margin, y, margin + pageWidth, y); y += 16;

      // Tipo de manutenção
      doc.setFont("helvetica", "bold");
      doc.text("PROTOCOLO DE MANUTENÇÃO", margin, y); y += 18;
      doc.setFont("helvetica", "normal");
      checkbox(doc, margin, y, dadosForm.tipo_manutencao === "corretiva");
      doc.text("CORRETIVA", margin + 14, y);
      checkbox(doc, margin + 100, y, dadosForm.tipo_manutencao === "preventiva");
      doc.text("PREVENTIVA", margin + 114, y);
      y += 20;

      if (dadosForm.numero_ciclos) {
        checkbox(doc, margin, y, true);
        doc.text(`EXECUÇÃO DE ${dadosForm.numero_ciclos} CICLO(S) COMPLETO(S) COM CRONOMETRAGEM DOS TEMPOS`, margin + 14, y);
        y += 18;
      }

      // Itens do checklist
      respostas.forEach(r => {
        if (y > 760) { doc.addPage(); y = margin; }
        const marcado = r.resposta === "conforme";
        checkbox(doc, margin, y, marcado);
        if (r.resposta === "nao_conforme") {
          doc.setTextColor(180, 40, 20);
        } else if (r.resposta === "nao_se_aplica") {
          doc.setTextColor(140, 140, 140);
        }
        const linhas = doc.splitTextToSize(r.descricao.toUpperCase(), pageWidth - 20);
        doc.text(linhas, margin + 14, y);
        y += linhas.length * 11;
        if (r.resposta === "nao_conforme" && r.observacao) {
          doc.setFont("helvetica", "italic");
          const obsLinhas = doc.splitTextToSize(`Obs.: ${r.observacao}`, pageWidth - 30);
          doc.text(obsLinhas, margin + 24, y);
          y += obsLinhas.length * 11;
          doc.setFont("helvetica", "normal");
        }
        doc.setTextColor(0, 0, 0);
        y += 4;
      });
      y += 8;

      // Observações gerais / caixa de texto livre
      if (dadosForm.observacoes_gerais) {
        if (y > 700) { doc.addPage(); y = margin; }
        doc.rect(margin, y, pageWidth, 60);
        const obsLinhas = doc.splitTextToSize(dadosForm.observacoes_gerais, pageWidth - 16);
        doc.text(obsLinhas, margin + 8, y + 14);
        y += 70;
      }

      // Tabela de peças substituídas
      const pecas = dadosForm.pecas || [];
      if (pecas.length) {
        if (y > 680) { doc.addPage(); y = margin; }
        doc.setFont("helvetica", "bold");
        doc.text("QTDE.", margin, y);
        doc.text("PEÇA/COMPONENTE", margin + 60, y);
        doc.text("SUBST.", margin + 400, y);
        doc.text("À SUBST.", margin + 460, y);
        y += 4;
        doc.line(margin, y, margin + pageWidth, y); y += 14;
        doc.setFont("helvetica", "normal");
        pecas.forEach(p => {
          if (y > 780) { doc.addPage(); y = margin; }
          doc.text(p.qtde || "", margin, y);
          doc.text(p.peca || "", margin + 60, y);
          checkbox(doc, margin + 400, y, p.substituida);
          checkbox(doc, margin + 460, y, !p.substituida);
          y += 16;
        });
        y += 6;
      }

      if (dadosForm.lacres) {
        campo2(doc, margin, y, "LACRE(S) Nº(S):", dadosForm.lacres);
        y += 16;
      }
      function campo2(doc, x, yy, label, valor) {
        doc.setFont("helvetica", "bold"); doc.text(label, x, yy);
        doc.setFont("helvetica", "normal"); doc.text(valor, x + 100, yy);
      }

      // Assinaturas
      if (y > 650) { doc.addPage(); y = margin; }
      y += 20;
      doc.addImage(sigPadTecnico.toDataURL("image/png"), "PNG", margin, y, 180, 60);
      doc.addImage(sigPadCliente.toDataURL("image/png"), "PNG", margin + 260, y, 180, 60);
      y += 62;
      doc.line(margin, y, margin + 180, y);
      doc.line(margin + 260, y, margin + 440, y);
      y += 12;
      doc.setFont("helvetica", "normal"); doc.setFontSize(9);
      doc.text("NOME E ASSINATURA DO(S) TÉCNICO(S)", margin, y);
      doc.text("NOME E ASSINATURA DO CLIENTE", margin + 260, y);
      y += 4;
      doc.setFontSize(8); doc.setTextColor(100, 100, 100);
      doc.text(funcionario.nome, margin, y + 10);
      doc.text(document.getElementById("nome-cliente").value, margin + 260, y + 10);

      return doc.output("datauristring").split(",")[1]; // base64
    }

    document.getElementById("form-checklist").addEventListener("submit", async (e) => {
      e.preventDefault();
      const erroEl = document.getElementById("erro-checklist");
      const btn = document.getElementById("btn-finalizar");
      erroEl.style.display = "none";

      if (sigPadTecnico.isEmpty() || sigPadCliente.isEmpty()) {
        erroEl.textContent = "As duas assinaturas são obrigatórias.";
        erroEl.style.display = "block";
        return;
      }

      btn.disabled = true;
      btn.textContent = "Enviando…";

      try {
        const funcionario = await cpFuncionarioAtual();
        const fd = new FormData(e.target);
        const pecas = coletarPecas();

        const dadosForm = {
          tipo_manutencao: fd.get("tipo_manutencao"),
          solicitado_por: fd.get("solicitado_por") || null,
          horario_inicio: fd.get("horario_inicio") || null,
          horario_termino: fd.get("horario_termino") || null,
          numero_ciclos: fd.get("numero_ciclos") || null,
          lacres: fd.get("lacres") || null,
          observacoes_gerais: fd.get("observacoes_gerais") || null,
          pecas,
        };

        // 1. cria o relatório
        const [relatorio] = await cpFetch("caspere_relatorios", {
          method: "POST",
          headers: { Prefer: "return=representation" },
          body: JSON.stringify({
            equipamento_id: equipamento.id,
            funcionario_id: funcionario.id,
            tipo_manutencao: dadosForm.tipo_manutencao,
            horario_inicio: dadosForm.horario_inicio,
            horario_termino: dadosForm.horario_termino,
            solicitado_por: dadosForm.solicitado_por,
            numero_ciclos: dadosForm.numero_ciclos,
            lacres: dadosForm.lacres,
            pecas_json: pecas,
            observacoes_gerais: dadosForm.observacoes_gerais,
            status: "finalizado",
          }),
        });

        // 2. grava as respostas dos itens
        const respostas = itensModelo.map(item => ({
          relatorio_id: relatorio.id,
          checklist_modelo_id: item.id,
          resposta: fd.get(`item-${item.id}`),
          observacao: fd.get(`obs-item-${item.id}`) || null,
          descricao: item.descricao, // só pro PDF, não vai pra tabela
        }));
        await cpFetch("caspere_relatorio_itens", {
          method: "POST",
          body: JSON.stringify(respostas.map(({ descricao, ...r }) => r)),
        });

        // 3. grava as assinaturas
        await cpFetch("caspere_assinaturas", {
          method: "POST",
          body: JSON.stringify([
            { relatorio_id: relatorio.id, tipo: "tecnico", nome_assinante: funcionario.nome, imagem_base64: sigPadTecnico.toDataURL("image/png") },
            { relatorio_id: relatorio.id, tipo: "cliente", nome_assinante: document.getElementById("nome-cliente").value, imagem_base64: sigPadCliente.toDataURL("image/png") },
          ]),
        });

        // 4. gera o PDF
        const pdfBase64 = await gerarPdf(relatorio, respostas, funcionario, dadosForm);

        // 5. sobe o PDF pro Storage (não trava a finalização se
        // falhar — o e-mail com o PDF anexado já é enviado de
        // qualquer forma no próximo passo).
        try {
          const pdfBytes = Uint8Array.from(atob(pdfBase64), c => c.charCodeAt(0));
          const caminhoPdf = `relatorio-${relatorio.id}.pdf`;
          const session2 = cpGetSession();
          const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/caspere-relatorios/${caminhoPdf}`, {
            method: "POST",
            headers: {
              "apikey": SUPABASE_ANON_KEY,
              "Authorization": `Bearer ${session2.access_token}`,
              "Content-Type": "application/pdf",
            },
            body: pdfBytes,
          });
          if (uploadRes.ok) {
            const pdfUrl = `${SUPABASE_URL}/storage/v1/object/public/caspere-relatorios/${caminhoPdf}`;
            await cpFetch(`caspere_relatorios?id=eq.${relatorio.id}`, {
              method: "PATCH",
              body: JSON.stringify({ pdf_url: pdfUrl }),
            });
          }
        } catch { /* upload é um extra — não interrompe o fluxo principal */ }

        // 6. envia por e-mail via Edge Function
        const session = cpGetSession();
        const res = await fetch(`${SUPABASE_URL}/functions/v1/enviar-relatorio`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_ANON_KEY,
            Authorization: `Bearer ${session.access_token}`,
          },
          body: JSON.stringify({ relatorio_id: relatorio.id, pdf_base64: pdfBase64 }),
        });
        if (!res.ok) {
          const body = await res.json().catch(() => ({}));
          throw new Error(body.error || "Relatório salvo, mas o e-mail não foi enviado. Tente reenviar pelo painel.");
        }

        window.location.href = `painel.html?relatorio_enviado=1`;
      } catch (err) {
        erroEl.textContent = err.message;
        erroEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Finalizar e enviar relatório";
      }
    });

    (async () => {
      cpRequireLogin();
      const funcionario = await cpFuncionarioAtual();
      if (!funcionario) { window.location.href = "login.html"; return; }
      document.getElementById("nome-tecnico").value = funcionario.nome;

      const params = new URLSearchParams(window.location.search);
      const equipId = params.get("equip");
      if (!equipId) {
        document.getElementById("cabecalho-equip").innerHTML = `<p class="cp-empty">Nenhum equipamento informado. Escaneie o QR Code novamente.</p>`;
        return;
      }

      try {
        const [equip] = await cpFetch(`caspere_equipamentos?id=eq.${equipId}&select=*,caspere_clientes(*)`);
        if (!equip) throw new Error("Equipamento não encontrado.");
        equipamento = equip;
        document.getElementById("cabecalho-equip").innerHTML = `
          <div class="cp-card">
            <h3>${esc(CP_TIPO_EQUIP_LABEL[equip.tipo] || equip.tipo)}</h3>
            <h1>${esc(equip.identificacao)}</h1>
            <p>${esc(equip.caspere_clientes?.razao_social || "")}</p>
          </div>`;

        itensModelo = await cpFetch("caspere_checklist_modelo?ativo=eq.true&select=*&order=ordem.asc");
        document.getElementById("itens-checklist").innerHTML = itensModelo.map(renderItem).join("");
        document.getElementById("form-checklist").style.display = "block";
        adicionarLinhaPeca(); // já deixa uma linha em branco pronta

        const canvasTecnico = document.getElementById("sig-tecnico");
        const canvasCliente = document.getElementById("sig-cliente");
        ajustarCanvas(canvasTecnico);
        ajustarCanvas(canvasCliente);
        sigPadTecnico = new SignaturePad(canvasTecnico);
        sigPadCliente = new SignaturePad(canvasCliente);
      } catch (err) {
        document.getElementById("cabecalho-equip").innerHTML = `<p style="color:var(--cp-nao-conforme);">${esc(err.message)}</p>`;
      }
    })();
  </script>
</body>
</html>
